<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小伴同学 · 专属故事</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/child.css">
</head>
<body>
  <div class="wrap">
    <!-- 顶部栏 -->
    <div class="chat-head">
      <div class="avatar" id="roleEmoji">🐻</div>
      <div class="info">
        <div class="name" id="roleName">小熊暖暖</div>
        <div class="timer">专属小故事</div>
      </div>
      <a class="link" href="chat.html" style="font-size:13px;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)">← 聊天</a>
    </div>

    <!-- 故事卡片 -->
    <div class="story-wrap">
      <div class="card story-card" id="storyCard">
        <!-- 由 story.js 渲染 -->
        <div class="center faint" style="padding:40px 0">故事生成中…</div>
      </div>

      <div class="story-actions">
        <button class="btn" id="listenBtn"><span>🔊</span> 听故事</button>
        <a class="btn ghost" href="chat.html">← 回到聊天</a>
      </div>

      <div class="card mt-16" style="margin-top:16px;padding:14px 18px">
        <div style="font-size:14px;color:var(--text-soft)">💡 亲子小提示</div>
        <div style="margin-top:6px;font-size:15px">听完故事，可以问问孩子：“你今天的心情是什么颜色呀？”</div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/mock-ai.js"></script>
  <script src="js/story.js"></script>
</body>
</html>
